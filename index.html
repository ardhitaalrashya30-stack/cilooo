<!-- Language: HTML | File: index.html | Target: All-in-One Client-Side Utility Dashboard | Toolchain: Vanilla HTML/CSS/JS -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Utility Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; }
        header { margin-bottom: 24px; text-align: center; }
        header h1 { font-size: 1.5rem; font-weight: 600; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; overflow-x: auto; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .tab-btn.active { background: var(--accent-color); border-color: var(--accent-color); }
        .panel { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .panel.active { display: block; }
        textarea, input[type="text"] { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 0.95rem; resize: vertical; }
        textarea { min-height: 120px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        button.action-btn { background: var(--accent-color); border: none; color: white; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        button.action-btn:hover { opacity: 0.9; }
        .output-box { background: #0f172a; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; min-height: 50px; word-break: break-all; font-family: monospace; font-size: 0.9rem; }
        .stats { display: flex; gap: 16px; font-size: 0.85rem; color: #94a3b8; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi-Utility Dashboard</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'text-panel')">Text Analyzer</button>
            <button class="tab-btn" onclick="switchTab(event, 'codec-panel')">Base64 / URL Codec</button>
            <button class="tab-btn" onclick="switchTab(event, 'pass-panel')">Password Generator</button>
        </div>

        <!-- Text Analyzer Panel -->
        <div id="text-panel" class="panel active">
            <textarea id="text-input" placeholder="Ketik atau tempel teks di sini..." oninput="analyzeText()"></textarea>
            <div class="stats">
                <span id="stat-chars">Karakter: 0</span>
                <span id="stat-words">Kata: 0</span>
                <span id="stat-lines">Baris: 0</span>
            </div>
            <div class="btn-group" style="margin-top: 12px;">
                <button class="action-btn" onclick="transformText('upper')">UPPERCASE</button>
                <button class="action-btn" onclick="transformText('lower')">lowercase</button>
                <button class="action-btn" onclick="clearText()">Reset</button>
            </div>
        </div>

        <!-- Codec Panel -->
        <div id="codec-panel" class="panel">
            <textarea id="codec-input" placeholder="Masukkan teks untuk dikodekan/didekode..."></textarea>
            <div class="btn-group">
                <button class="action-btn" onclick="encodeBase64()">Base64 Encode</button>
                <button class="action-btn" onclick="decodeBase64()">Base64 Decode</button>
                <button class="action-btn" onclick="encodeUrl()">URL Encode</button>
                <button class="action-btn" onclick="decodeUrl()">URL Decode</button>
            </div>
            <div class="output-box" id="codec-output">Hasil konversi akan muncul di sini...</div>
        </div>

        <!-- Password Generator Panel -->
        <div id="pass-panel" class="panel">
            <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 12px;">
                <label>Panjang: <span id="length-val">16</span></label>
                <input type="range" id="pass-length" min="8" max="64" value="16" oninput="document.getElementById('length-val').innerText = this.value">
            </div>
            <div class="btn-group">
                <button class="action-btn" onclick="generatePassword()">Generate Password</button>
            </div>
            <div class="output-box" id="pass-output">Klik generate untuk membuat password aman</div>
        </div>
    </div>

    <script>
        function switchTab(evt, panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function analyzeText() {
            const val = document.getElementById('text-input').value;
            document.getElementById('stat-chars').innerText = `Karakter: ${val.length}`;
            document.getElementById('stat-words').innerText = `Kata: ${val.trim() === '' ? 0 : val.trim().split(/\s+/).length}`;
            document.getElementById('stat-lines').innerText = `Baris: ${val.split('\n').length}`;
        }

        function transformText(mode) {
            const el = document.getElementById('text-input');
            el.value = mode === 'upper' ? el.value.toUpperCase() : el.value.toLowerCase();
            analyzeText();
        }

        function clearText() {
            document.getElementById('text-input').value = '';
            analyzeText();
        }

        function encodeBase64() {
            try {
                const val = document.getElementById('codec-input').value;
                document.getElementById('codec-output').innerText = btoa(unescape(encodeURIComponent(val)));
            } catch (e) {
                document.getElementById('codec-output').innerText = 'Error: ' + e.message;
            }
        }

        function decodeBase64() {
            try {
                const val = document.getElementById('codec-input').value;
                document.getElementById('codec-output').innerText = decodeURIComponent(escape(atob(val)));
            } catch (e) {
                document.getElementById('codec-output').innerText = 'Error: ' + e.message;
            }
        }

        function encodeUrl() {
            const val = document.getElementById('codec-input').value;
            document.getElementById('codec-output').innerText = encodeURIComponent(val);
        }

        function decodeUrl() {
            const val = document.getElementById('codec-input').value;
            document.getElementById('codec-output').innerText = decodeURIComponent(val);
        }

        function generatePassword() {
            const len = document.getElementById('pass-length').value;
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            let res = "";
            const array = new Uint32Array(len);
            window.crypto.getRandomValues(array);
            for (let i = 0; i < len; i++) {
                res += chars[array[i] % chars.length];
            }
            document.getElementById('pass-output').innerText = res;
        }
    </script>
</body>
</html>
